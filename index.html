<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f5eff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>PNR Summary</title>
<style>
  :root { --bg:#f3f4f8; --card:#fff; --text:#16181f; --muted:#5f6675; --accent:#1f5eff; --hl:#fff3a8; --line:#222; --ok:#0a7d33; --warn:#b45309; --bad:#b91c1c; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:560px; margin:0 auto; padding:20px 12px 56px; }
  h1 { font-size:1.3rem; margin:0 0 12px; text-align:center; }
  form { display:flex; gap:8px; }
  #pnr { flex:1; min-width:0; font-size:1.3rem; letter-spacing:.15em; padding:13px; border:2px solid var(--line); border-radius:8px; background:#fff; color:#000; }
  #pnr:focus { outline:3px solid var(--accent); }
  #go { font-size:1rem; padding:0 18px; border:0; border-radius:8px; background:var(--accent); color:#fff; }
  #go:disabled { opacity:.5; }
  .msg { margin:10px 0; min-height:1.3em; color:var(--muted); font-size:.95rem; text-align:center; }
  .msg.err { color:var(--bad); }

  .sheet { background:var(--card); border:2px solid var(--line); margin-top:12px; }
  .banner { padding:8px 10px; text-align:center; font-size:.78rem; background:#eee; border-bottom:2px solid var(--line); color:#333; }
  .title { padding:10px; text-align:center; font-weight:700; border-bottom:2px solid var(--line); }
  table { width:100%; border-collapse:collapse; }
  td { border-top:1px solid var(--line); padding:8px 10px; vertical-align:middle; }
  td:first-child { width:42%; font-weight:600; font-size:.9rem; border-right:1px solid var(--line); background:var(--hl); }
  td:last-child { text-align:center; font-weight:600; }
  tr.plain td:first-child { background:transparent; }
  td.big { font-size:1.35rem; }
  .fill { width:100%; border:0; border-bottom:1px dashed #888; background:transparent; font:inherit; font-weight:600; text-align:center; color:inherit; padding:2px; }
  .fill:focus { outline:none; border-bottom:2px solid var(--accent); }
  .CNF { color:var(--ok); } .WL, .RAC, .RLWL, .PQWL { color:var(--warn); }
  .pax { text-align:left; font-weight:500; font-size:.92rem; }
  .pax div { padding:2px 0; }

  .actions { display:flex; gap:8px; margin-top:12px; }
  .actions button { flex:1; padding:12px; border:1px solid var(--accent); background:#fff; color:var(--accent); border-radius:8px; font-size:.95rem; }
  footer { margin-top:18px; color:var(--muted); font-size:.78rem; text-align:center; }

  @media print { body { background:#fff; } form, .msg, .actions, footer { display:none; } .sheet { margin:0; } }
</style>
</head>
<body>
<main>
  <h1>PNR Summary</h1>

  <form id="f" autocomplete="off">
    <input id="pnr" inputmode="numeric" maxlength="10" placeholder="10-digit PNR" aria-label="PNR number" autofocus>
    <button id="go" type="submit" disabled>Check</button>
  </form>
  <div id="msg" class="msg" role="status" aria-live="polite"></div>
  <div id="out"></div>

  <footer>Unofficial tool. Not an official Indian Railways document. Verify on IRCTC before travelling. Nothing you enter is stored.</footer>
</main>

<script>
const $ = id => document.getElementById(id);
const input = $('pnr'), go = $('go'), msg = $('msg'), out = $('out');
let inflight = 0, current = null;

input.addEventListener('input', () => {
  input.value = input.value.replace(/\D/g, '').slice(0, 10);
  go.disabled = input.value.length !== 10;
  if (input.value.length === 10) lookup(input.value);
  else { out.replaceChildren(); setMsg(''); current = null; }
});
$('f').addEventListener('submit', e => { e.preventDefault(); if (input.value.length === 10) lookup(input.value); });

function setMsg(t, err) { msg.textContent = t; msg.className = 'msg' + (err ? ' err' : ''); }
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function row(label, valueNode, opts = {}) {
  const tr = el('tr', opts.plain ? 'plain' : '');
  const td = el('td', opts.big ? 'big' : '');
  if (typeof valueNode === 'string') td.textContent = valueNode || '—'; else td.append(valueNode);
  tr.append(el('td', null, label), td);
  return tr;
}
function fillInput(ph) { const i = el('input', 'fill'); i.placeholder = ph; return i; }
function fmtPnr(p) { return p.slice(0, 3) + '-' + p.slice(3); }

async function lookup(pnr) {
  const id = ++inflight;
  setMsg('Fetching details…'); out.replaceChildren(); go.disabled = true;
  try {
    const r = await fetch('/api/pnr?pnr=' + encodeURIComponent(pnr));
    const data = await r.json();
    if (id !== inflight) return;
    if (!r.ok) throw new Error(data.error || 'Lookup failed');
    current = data; render(data); setMsg('');
  } catch (e) {
    if (id === inflight) setMsg(e.message || 'Something went wrong. Try again.', true);
  } finally {
    if (id === inflight) go.disabled = input.value.length !== 10;
  }
}

function render(d) {
  const sheet = el('div', 'sheet');
  sheet.append(el('div', 'banner', 'Information summary. Not an official document.'),
               el('div', 'title', 'Journey details from PNR'));

  const t = el('table');
  const train = [d.trainNumber, d.trainName].filter(Boolean).join(' / ');
  const pax = el('div', 'pax');
  (d.passengers || []).forEach((p, i) => {
    const line = el('div');
    line.append(document.createTextNode((p.number || i + 1) + '. ' + (p.booking ? p.booking + ' · ' : '')));
    line.append(el('span', String(p.current || '').split(/[\s/]/)[0].toUpperCase(), p.current || '—'));
    pax.append(line);
  });
  if (!pax.children.length) pax.textContent = '—';

  const berths = (d.passengers || []).length;
  t.append(
    row('Requested by', fillInput('Type name')),
    row('Train no. / name', train),
    row('Date of journey', d.doj),
    row('No. of berths', berths ? String(berths) : '—'),
    row('Class', d.travelClass),
    row('Quota', d.quota),
    row('Station from', d.boarding || d.from),
    row('Station to', d.to),
    row('PNR number', fmtPnr(d.pnr), { big: true }),
    row('Passenger status', pax),
    row('Passenger name', fillInput('Type name(s)')),
    row('Purpose of journey', fillInput('Type purpose')),
    row('Mobile no.', fillInput('Type number'), { plain: true })
  );
  sheet.append(t);

  const actions = el('div', 'actions');
  const copy = el('button', null, 'Copy details');
  copy.type = 'button';
  copy.addEventListener('click', async () => {
    const lines = [...t.querySelectorAll('tr')].map(tr => {
      const [a, b] = tr.children; const inp = b.querySelector('input');
      return a.textContent + ': ' + (inp ? inp.value : b.innerText.replace(/\n/g, '; '));
    });
    try { await navigator.clipboard.writeText(lines.join('\n')); copy.textContent = 'Copied'; }
    catch { copy.textContent = 'Copy failed'; }
    setTimeout(() => copy.textContent = 'Copy details', 1500);
  });
  const print = el('button', null, 'Print / Save PDF');
  print.type = 'button';
  print.addEventListener('click', () => window.print());
  actions.append(copy, print);

  out.replaceChildren(sheet, actions);
}
</script>
</body>
</html>
